<!DOCTYPE html>
<html>
<head>
    <title>Surpresa</title>
    <meta property="og:image" content="https://i.imgur.com/f9wZQ2Y.png">
<meta property="og:title" content="Uma surpresa pra você 🌸">
<meta property="og:description" content="Clica no coração ❤️">
    
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #fff0f5;
            margin: 0;
        }
        .coracao {
            font-size: 100px;
            cursor: pointer;
            color: red;
            transition: transform 0.3s;
        }
        .coracao:hover {
            transform: scale(1.2);
        }
        .imagem {
            display: none;
            margin-top: 30px;
            max-width: 90%;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="coracao" onclick="mostrarImagem()">❤️</div>
    <img src="w0fu52c6a8t61.jpg"
     class="imagem" id="minhaImagem">

    <script>
        function mostrarImagem() {
            document.getElementById('minhaImagem').style.display = 'block';
        }
    </script>

</body>
</html>
